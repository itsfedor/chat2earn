# Groq API settings
groq:
  api-key: "YOUR_GROQ_API_KEY"
  model: "llama-3.1-8b-instant"
  timeout-seconds: 10

# Scoring
scoring:
  points-per-message-max: 4
  dollars-per-point: 0.10
  milestone-dollars: 5.0

# Filters
filters:
  min-words: 3
  max-cyrillic-percent: 49

# Messages (Russian + English mix, 20 variants with color codes)
# &0 black  &1 dark_blue  &2 dark_green  &3 dark_aqua  &4 dark_red
# &5 dark_purple  &6 gold  &7 gray  &8 dark_gray  &9 blue
# &a green  &b aqua  &c red  &d light_purple  &e yellow  &f white
# &l bold  &o italic  &n underline  &m strikethrough  &r reset
